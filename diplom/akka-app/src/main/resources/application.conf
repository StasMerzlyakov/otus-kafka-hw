akka {
  windowStep = "10s"
  windowLength = "30s"
  kafka {
    consumer {
      kafka-clients {
        enable.auto.commit = true
        bootstrap.servers = "broker:9092"
        group.id = "group1"
        auto.offset.reset = "earliest"
      }
      input-topic = "events_topic"
    }
    producer {
      kafka-clients {
        bootstrap.servers = "broker:9092"
      }
      output-topic = "speed_topic"
    }
  }
}